<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Lanches Família Machado</title>
    <style>
        :root {
            --primary: #ff4757;
            --primary-dark: #e84118;
            --dark: #1e1e24;
            --darker: #121216;
            --light: #f5f6fa;
            --accent: #ffa502;
            --card-bg: #2b2b36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--darker);
            color: var(--light);
            padding-bottom: 120px;
        }

        header {
            background: linear-gradient(135deg, var(--dark), var(--darker));
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header h1 {
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #ddd;
            font-size: 0.95rem;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .category-title {
            color: var(--accent);
            font-size: 1.5rem;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,165,2,0.3);
        }

        .item-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #1e1e24;
        }

        .item-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .item-price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .item-stock {
            font-size: 0.75rem;
            color: #2ed573;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-options {
            margin-bottom: 12px;
        }

        .item-options label {
            font-size: 0.8rem;
            color: var(--accent);
            display: block;
            margin-bottom: 3px;
        }

        .item-options select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            background: #1e1e24;
            color: #fff;
            border: 1px solid #444;
            font-size: 0.85rem;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn-add:hover {
            background-color: var(--primary-dark);
        }

        /* Carrinho Flutuante */
        .cart-float {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark);
            border-top: 3px solid var(--accent);
            padding: 15px 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-info {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .cart-total {
            color: var(--accent);
        }

        .btn-checkout {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background-color: #1ebe5d;
        }

        /* Modal do Carrinho */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #444;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items-list {
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #ccc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background: #1e1e24;
            color: #fff;
            border: 1px solid #444;
        }

        .badge-destaque {
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lanches Família Machado</h1>
        <p>Qualidade, Sabor e Muito Amor em Cada Lanche!</p>
    </header>

    <div class="container" id="menu-container">
        <!-- Gerado via JavaScript -->
    </div>

    <!-- Barra de Carrinho Flutuante -->
    <div class="cart-float">
        <div class="cart-info">
            <span>Itens: <span id="cart-count">0</span></span> | 
            <span class="cart-total">Total: R$ <span id="cart-total">0.00</span></span>
        </div>
        <button class="btn-checkout" onclick="openCartModal()">Ver Carrinho / Pedir</button>
    </div>

    <!-- Modal de Fechamento de Pedido -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Pedido</h2>
                <button class="close-modal" onclick="closeCartModal()">&times;</button>
            </div>
            <div class="cart-items-list" id="cart-items-list">
                <!-- Itens do carrinho -->
            </div>
            <div style="font-weight: bold; text-align: right; margin-bottom: 15px; font-size: 1.1rem;">
                Total: R$ <span id="modal-total">0.00</span>
            </div>
            
            <div class="form-group">
                <label>Seu Nome:</label>
                <input type="text" id="client-name" placeholder="Digite seu nome completo">
            </div>
            <div class="form-group">
                <label>Forma de Entrega:</label>
                <select id="delivery-type" onchange="toggleAddress()">
                    <option value="Entrega">Entrega em Casa</option>
                    <option value="Retirada">Retirar no Local</option>
                </select>
            </div>
            <div class="form-group" id="address-group">
                <label>Endereço de Entrega (Rua, Número, Bairro):</label>
                <input type="text" id="client-address" placeholder="Ex: Rua A, 123 - Centro">
            </div>
            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="payment-method">
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro (Informar troco se precisar)</option>
                    <option value="Cartão">Cartão (Débito/Crédito)</option>
                </select>
            </div>

            <button class="btn-checkout" style="width: 100%; justify-content: center; margin-top: 15px;" onclick="sendWhatsApp()">
                Enviar Pedido pelo WhatsApp 🚀
            </button>
        </div>
    </div>
