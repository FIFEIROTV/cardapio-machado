<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Lanches & Doces Família Machado</title>
    <style>
        :root {
            --primary: #ff4757;
            --primary-dark: #e84118;
            --dark: #1e1e24;
            --darker: #121216;
            --light: #f5f6fa;
            --accent: #ffa502;
            --card-bg: #2b2b36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--darker);
            color: var(--light);
            padding-bottom: 120px;
        }

        header {
            background: linear-gradient(135deg, var(--dark), var(--darker));
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header h1 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #ddd;
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .category-title {
            color: var(--accent);
            font-size: 1.4rem;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,165,2,0.3);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
        }

        .item-price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.05rem;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .item-options {
            margin-bottom: 12px;
        }

        .item-options label {
            font-size: 0.8rem;
            color: var(--accent);
            display: block;
            margin-bottom: 3px;
        }

        .item-options select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            background: #1e1e24;
            color: #fff;
            border: 1px solid #444;
            font-size: 0.85rem;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn-add:hover {
            background-color: var(--primary-dark);
        }

        /* Carrinho Flutuante */
        .cart-float {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark);
            border-top: 3px solid var(--accent);
            padding: 15px 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-info {
            font-size: 1rem;
            font-weight: bold;
        }

        .cart-total {
            color: var(--accent);
        }

        .btn-checkout {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background-color: #1ebe5d;
        }

        /* Modal do Carrinho */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #444;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items-list {
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #ccc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background: #1e1e24;
            color: #fff;
            border: 1px solid #444;
        }

        .badge-destaque {
            background: var(--primary);
            color: white;
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lanches & Doces Família Machado</h1>
        <p>O melhor lanche, copão e sobremesa da região!</p>
    </header>

    <div class="container" id="menu-container">
        <!-- Gerado via JavaScript -->
    </div>

    <!-- Barra de Carrinho Flutuante -->
    <div class="cart-float">
        <div class="cart-info">
            <span>Itens: <span id="cart-count">0</span></span> | 
            <span class="cart-total">Total: R$ <span id="cart-total">0.00</span></span>
        </div>
        <button class="btn-checkout" onclick="openCartModal()">Ver Carrinho / Pedir</button>
    </div>

    <!-- Modal de Fechamento de Pedido -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Pedido</h2>
                <button class="close-modal" onclick="closeCartModal()">&times;</button>
            </div>
            <div class="cart-items-list" id="cart-items-list">
                <!-- Itens do carrinho -->
            </div>
            <div style="font-weight: bold; text-align: right; margin-bottom: 15px; font-size: 1.1rem;">
                Total: R$ <span id="modal-total">0.00</span>
            </div>
            
            <div class="form-group">
                <label>Seu Nome:</label>
                <input type="text" id="client-name" placeholder="Digite seu nome completo">
            </div>
            <div class="form-group">
                <label>Forma de Entrega:</label>
                <select id="delivery-type" onchange="toggleAddress()">
                    <option value="Entrega">Entrega em Casa</option>
                    <option value="Retirada">Retirar no Local</option>
                </select>
            </div>
            <div class="form-group" id="address-group">
                <label>Endereço de Entrega (Rua, Número, Bairro):</label>
                <input type="text" id="client-address" placeholder="Ex: Rua A, 123 - Centro">
            </div>
            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="payment-method">
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro (Informar troco se precisar)</option>
                    <option value="Cartão">Cartão (Débito/Crédito)</option>
                </select>
            </div>

            <button class="btn-checkout" style="width: 100%; justify-content: center; margin-top: 15px;" onclick="sendWhatsApp()">
                Enviar Pedido pelo WhatsApp 🚀
            </button>
        </div>
    </div>

    <script>
        const menuData = [
            {
                category: "🍔 Lanches do Pai",
                items: [
                    { id: 1, name: "Hot Dog Simples", price: 10.00, desc: "Pão, 1 salsicha, maionese, mostarda, ketchup, batata palha, milho e tomate." },
                    { id: 2, name: "Hot Dog Especial", price: 15.00, desc: "Pão, 2 salsichas, maionese, mostarda, ketchup, batata palha, milho, tomate, bacon e calabresa." },
                    { id: 3, name: "Hambúrguer Simples", price: 17.00, desc: "Pão, hambúrguer, maionese, mostarda, ketchup, milho e tomate." },
                    { id: 4, name: "X-Bacon", price: 18.00, desc: "Pão, hambúrguer, maionese, mostarda, ketchup, milho, tomate, presunto, mussarela e bacon." },
                    { id: 5, name: "X-Calabresa", price: 18.00, desc: "Pão, hambúrguer, maionese, mostarda, ketchup, milho, tomate, presunto, mussarela e calabresa." },
                    { id: 6, name: "X-Tudo", price: 22.00, desc: "Pão, 2 hambúrgueres, maionese, mostarda, ketchup, ovo, bacon, calabresa, milho, tomate, presunto, mussarela e batata palha.", destaque: "O Mais Recheado!" }
                ]
            },
            {
                category: "🥤 Bebidas & Cervejas",
                items: [
                    { id: 7, name: "Coca-Cola 2L", price: 16.00, desc: "Refrigerante 2 Litros" },
                    { id: 8, name: "Refrigerante 2L (Outras Marcas)", price: 10.00, desc: "Guaraná / Soda / Kuat" },
                    { id: 9, name: "Coca-Cola Lata", price: 7.00, desc: "Lata 350ml" },
                    { id: 10, name: "Skol / Brahma Lata", price: 6.00, desc: "Lata 350ml" },
                    { id: 11, name: "Cerveja 600ml (Skol/Brahma)", price: 10.00, desc: "Garrafa Grande" }
                ]
            },
            {
                category: "🍹 Copões & Drinks",
                items: [
                    { id: 12, name: "Black Blend", price: 10.00, desc: "Copão preparado com sabor e qualidade." },
                    { id: 13, name: "Chevette", price: 12.00, desc: "O clássico geladinho." },
                    { 
                        id: 14, name: "Copão de Gin", price: 14.00, desc: "Escolha o sabor:",
                        options: ["Morango", "Melancia", "Maçã Verde", "Tropical"]
                    },
                    { 
                        id: 15, name: "Passaporte", price: 18.00, desc: "Escolha a opção:",
                        options: ["Tradicional - R$ 18,00", "Com Mango Loco / Red Bull - R$ 33,00"],
                        prices: [18.00, 33.00]
                    },
                    { id: 16, name: "Busca Brisa", price: 22.00, desc: "Copão preparado especial." },
                    { 
                        id: 17, name: "Cavalo Branco", price: 25.00, desc: "Escolha a opção:",
                        options: ["Tradicional - R$ 25,00", "Com Mango Loco / Red Bull - R$ 40,00"],
                        prices: [25.00, 40.00]
                    },
                    { 
                        id: 18, name: "Red Label", price: 35.00, desc: "Escolha a opção:",
                        options: ["Tradicional - R$ 35,00", "Com Red Bull / Monster - R$ 50,00"],
                        prices: [35.00, 50.00]
                    }
                ]
            },
            {
                category: "🍫 Doces & Snacks (Seu Toque Especial)",
                items: [
                    { id: 19, name: "KitKat", price: 5.00, desc: "Chocolate" },
                    { 
                        id: 20, name: "Trento", price: 4.00, desc: "Escolha o sabor:",
                        options: ["Chocolate ao Leite", "Dark", "White", "Torta de Limão"]
                    },
                    { id: 21, name: "Ouro Branco / Sonho de Valsa", price: 2.00, desc: "Bombom unidade" },
                    { id: 22, name: "Paçoca", price: 1.00, desc: "Doce de amendoim" },
                    { id: 23, name: "Trident (Hortelã / Melancia)", price: 3.50, desc: "Goma de mascar" },
                    { 
                        id: 24, name: "Salgadinho Torcida", price: 3.50, desc: "Escolha o sabor:",
                        options: ["Pimenta", "Cebola", "Bacon", "Costelinha com Limão", "Churrasco"]
                    }
                ]
            }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            let html = '';

            menuData.forEach(cat => {
                html += `<div class="category-title">${cat.category}</div>`;
                html += `<div class="items-grid">`;
                
                cat.items.forEach(item => {
                    let badge = item.destaque ? `<span class="badge-destaque">${item.destaque}</span>` : '';
                    let optionsHtml = '';

                    if (item.options) {
                        let optionsList = item.options.map((opt, idx) => `<option value="${idx}">${opt}</option>`).join('');
                        optionsHtml = `
                            <div class="item-options">
                                <label>Opção / Sabor:</label>
                                <select id="opt-${item.id}">${optionsList}</select>
                            </div>
                        `;
                    }

                    html += `
                        <div class="item-card">
                            <div>
                                <div class="item-header">
                                    <div class="item-title">${item.name} ${badge}</div>
                                    <div class="item-price" id="price-${item.id}">R$ ${item.price.toFixed(2)}</div>
                                </div>
                                <div class="item-desc">${item.desc}</div>
                                ${optionsHtml}
                            </div>
                            <button class="btn-add" onclick="addToCart(${item.id})">Adicionar +</button>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function addToCart(itemId) {
            let foundItem = null;
            for (let cat of menuData) {
                let it = cat.items.find(i => i.id === itemId);
                if (it) { foundItem = it; break; }
            }

            if (!foundItem) return;

            let finalPrice = foundItem.price;
            let selectedOptionText = '';

            if (foundItem.options) {
                let selectElem = document.getElementById(`opt-${itemId}`);
                let selectedIndex = selectElem.selectedIndex;
                selectedOptionText = ` (${foundItem.options[selectedIndex]})`;
                
                if (foundItem.prices) {
                    finalPrice = foundItem.prices[selectedIndex];
                }
            }

            let cartItemName = foundItem.name + selectedOptionText;
            let existing = cart.find(i => i.name === cartItemName);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    name: cartItemName,
                    price: finalPrice,
                    quantity: 1
                });
            }

            updateCartUI();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
            });

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = totalPrice.toFixed(2);
            document.getElementById('modal-total').innerText = totalPrice.toFixed(2);

            let listHtml = '';
            cart.forEach((item, index) => {
                listHtml += `
                    <div class="cart-item-row">
                        <div>${item.quantity}x ${item.name}</div>
                        <div>
                            R$ ${(item.price * item.quantity).toFixed(2)}
                            <button onclick="removeItem(${index})" style="background:none; border:none; color:#ff4757; margin-left:8px; cursor:pointer; font-weight:bold;">✕</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-items-list').innerHTML = listHtml || '<p style="color:#888; text-align:center;">Carrinho vazio</p>';
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCartModal() {
            if (cart.length === 0) {
                alert('Seu carrinho está vazio! Adicione alguns itens antes de pedir.');
                return;
            }
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function toggleAddress() {
            let type = document.getElementById('delivery-type').value;
            let group = document.getElementById('address-group');
            group.style.display = type === 'Entrega' ? 'block' : 'none';
        }

        function sendWhatsApp() {
            let name = document.getElementById('client-name').value.trim();
            if (!name) {
                alert('Por favor, digite o seu nome!');
                return;
            }

            let deliveryType = document.getElementById('delivery-type').value;
            let address = document.getElementById('client-address').value.trim();
            let payment = document.getElementById('payment-method').value;

            if (deliveryType === 'Entrega' && !address) {
                alert('Por favor, informe o endereço de entrega!');
                return;
            }

            let message = `*🍕 NOVO PEDIDO - FAMÍLIA MACHADO*\n\n`;
            message += `*Cliente:* ${name}\n`;
            message += `*Tipo:* ${deliveryType}\n`;
            if (deliveryType === 'Entrega') {
                message += `*Endereço:* ${address}\n`;
            }
            message += `*Pagamento:* ${payment}\n\n`;
            message += `*--- ITENS DO PEDIDO ---*\n`;

            let total = 0;
            cart.forEach(item => {
                message += `• ${item.quantity}x ${item.name} - R$ ${(item.price * item.quantity).toFixed(2)}\n`;
                total += item.price * item.quantity;
            });

            message += `\n*TOTAL A PAGAR: R$ ${total.toFixed(2)}*`;

            let phone = "15996284744"; // Altere para o WhatsApp de vocês se precisar

            let encoded = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank');
        }

        window.onload = renderMenu;
    </script>
</body>
</html>
